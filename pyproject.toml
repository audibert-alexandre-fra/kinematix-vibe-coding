[project]
name = "kinematix-vibe-coding"
version = "0.1.0"
description = "Capture du mouvement monoculaire : estimation de pose 3D -> marqueurs -> calibration + cinématique inverse MuJoCo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "mujoco>=3.2",
    "onnxruntime>=1.19",
    "huggingface-hub>=0.24",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Détecteur de personne RF-DETR (Apache-2.0) ; nécessite torch.
detector = [
    "rfdetr>=1.2",
]

[project.scripts]
kinematix = "kinematix_vibe_coding.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinematix_vibe_coding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests nécessitant des poids de modèles / vidéos réelles (désactivés en CI)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts de benchmark des dépôts tiers : style compact toléré
"tools/*" = ["E702", "B905"]
